name: Build and Push Docker Image (Multi-Arch)

on:
  push:
    branches: ["main"]
    paths:
      - 'Dockerfile'
      - 'youtube.sh'
      - 'entrypoint.sh'
      - 'web/**'
      - '.github/workflows/docker-image.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Docker Hub 命名空间只允许小写字母数字与 . _ - ，否则 tag 会报 invalid reference format
    - name: Resolve Docker Hub namespace
      id: hub
      env:
        DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        set -eux
        dh_user="$(printf '%s' "${DH_USER}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
        if ! printf '%s' "$dh_user" | grep -Eq '^[a-z0-9]+([._-][a-z0-9]+)*$'; then
          echo "::warning::DOCKERHUB_USERNAME 不是合法的 Docker 命名空间，已跳过 Docker Hub 推送（ghcr 不受影响）"
          dh_user=""
        fi
        echo "user=${dh_user}" >> "$GITHUB_OUTPUT"

    # PR 只构建验证，绝不推送，避免未合并代码覆盖 latest
    - name: Build and Push Multi-Arch Image
      if: steps.hub.outputs.user != ''
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.hub.outputs.user }}/ffmpeg-autostream:latest
