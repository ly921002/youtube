name: Shell Lint

on:
  push:
    branches: ["main"]
    paths:
      - '**.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 换行符必须是 LF
        run: |
          if grep -qU $'\r' youtube.sh; then
            echo "::error::youtube.sh 含有 CRLF 换行符，shell 脚本必须使用 LF"
            exit 1
          fi

      - name: bash 语法检查
        run: bash -n youtube.sh

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --shell=bash --severity=warning youtube.sh
