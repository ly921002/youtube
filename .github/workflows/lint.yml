name: Shell Lint

on:
  push:
    branches: ["main"]
    paths:
      - '**.sh'
      - '.github/workflows/lint.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 换行符必须是 LF
        run: |
          for f in youtube.sh entrypoint.sh; do
            if grep -qU $'\r' "$f"; then
              echo "::error::$f 含有 CRLF 换行符，shell 脚本必须使用 LF"
              exit 1
            fi
          done

      - name: bash 语法检查
        run: |
          bash -n youtube.sh
          bash -n entrypoint.sh

      - name: Python 语法检查
        run: python3 -m py_compile web/server.py

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            --shell=bash --severity=warning youtube.sh entrypoint.sh
