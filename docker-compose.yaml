services:
  ffmpegstream:
    # 也可换成 Docker Hub 镜像：ly920907/ffmpeg-autostream:latest
    image: ghcr.io/ly921002/ffmpeg-autostream:latest
    container_name: ffmpeg-streamer
    restart: always

    environment:
      MULTI_RTMP_URLS: "rtmp://a.rtmp.youtube.com/live2/直播码"
      FONT_FILE: "/usr/share/fonts/noto/NotoSansCJK-Regular.ttc"
      SLEEP_SECONDS: "5"
      SHOW_FILENAME: "no" # 默认 copy 模式；yes 开启转码模式并显示当前播放文件名
      WATERMARK: "no" # 默认 copy 模式；yes 开启转码模式并显示水印
      WATERMARK_IMG: "" # 水印路径

      # ---- 控制面板 ----
      STATUS_ENABLED: "yes"
      PORT: "8080"
      # 默认只监听容器本机，配合下面的 127.0.0.1 端口映射，只有宿主机能访问。
      # 需要局域网/公网访问时：WEB_HOST 改 0.0.0.0、端口映射去掉 127.0.0.1 前缀，
      # 并且必须设置 WEB_USER / WEB_PASSWORD。
      WEB_HOST: "127.0.0.1"
      WEB_USER: "admin"
      WEB_PASSWORD: "change-me" # 务必修改

      # ---- 稳定性（详见 README）----
      # STALL_TIMEOUT: "30"
      # RETRY_MAX: "3"
      # RETRY_BACKOFF: "5"

      # ---- 无视频时的等待策略 ----
      WAIT_FOR_VIDEOS: "yes" # 目录里暂时没视频时等待而不是退出，面板保持可访问
      VIDEO_SCAN_INTERVAL: "30" # 等待期间重新扫描视频目录的间隔（秒）
      # FOLDER: "2"            # 扫描深度：1=只看 /videos 下，2=含一层子目录
      # VIDEO_EXTENSIONS: "mp4,avi,mkv,mov,flv,wmv,webm"

    volumes:
      - /home/ubuntu/videos:/videos
      - stream-status:/app/status

    # 宿主 8080 常被其它服务占用，这里映射到 18080；容器内仍是 8080（PORT 环境变量）
    # 需要换端口只改左边的 18080 即可，例如 "127.0.0.1:28080:8080"
    ports:
      - "127.0.0.1:18080:8080"

    # 限制 docker logs（否则 FFmpeg 会刷爆日志）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stream-status:
